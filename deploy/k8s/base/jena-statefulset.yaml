apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jena
  namespace: ontology-platform
  labels:
    app.kubernetes.io/part-of: ontology-platform
    app.kubernetes.io/component: jena
spec:
  serviceName: jena
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: jena
  template:
    metadata:
      labels:
        app.kubernetes.io/component: jena
    spec:
      containers:
        - name: jena
          image: stain/jena-fuseki:4.10.0
          ports:
            - containerPort: 3030
              name: http
          env:
            - name: FUSEKI_DATASETS
              value: "ontology"
          volumeMounts:
            - name: jena-data
              mountPath: /fuseki
          readinessProbe:
            httpGet:
              path: /
              port: 3030
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3030
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
  volumeClaimTemplates:
    - metadata:
        name: jena-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jena
  namespace: ontology-platform
  labels:
    app.kubernetes.io/part-of: ontology-platform
    app.kubernetes.io/component: jena
spec:
  selector:
    app.kubernetes.io/component: jena
  ports:
    - port: 3030
      targetPort: 3030
      name: http
