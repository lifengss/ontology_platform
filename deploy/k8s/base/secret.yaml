apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: ontology-platform
  labels:
    app.kubernetes.io/part-of: ontology-platform
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  NEO4J_PASSWORD: "neo4jsecret"
  # 生产环境请用 kubectl create secret 注入外部值，勿将明文提交到 git。
  NEO4J_AUTH: "neo4j/neo4jsecret"
  POSTGRES_PASSWORD: "ontsecret"
  # 会话签名密钥（migrate 脚本生成；此处为占位，生产必须覆盖）
  # 实际挂载到 /app/secrets/auth_secret.json
  AUTH_SECRET_JSON: '{"secret": "CHANGE_ME_K8S_DEPLOY"}'
